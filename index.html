  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 14px 24px; font: 700 16px "DM Sans", system-ui, sans-serif; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap; }
  .btn.main { background: var(--coral); color: #fff; box-shadow: 0 8px 22px rgba(255,90,54,.3); }

  .ba .bar { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 3px; background: #fff; transform: translateX(-50%); pointer-events: none; }
  .ba .knob { position: absolute; top: 50%; left: var(--x, 50%); width: 46px; height: 46px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 6px 18px rgba(0,0,0,.25); display: grid; place-items: center; font-weight: 800; color: var(--ink); pointer-events: none; }
  .ba .tag { position: absolute; top: 14px; padding: 5px 12px; border-radius: 999px; font: 700 12px "DM Sans", system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }

  .ba .tag.r { right: 14px; background: var(--sun); color: var(--ink); }

  .price .badge { position: absolute; top: -12px; left: 24px; background: var(--coral); color: #fff; font: 700 12px "DM Sans", system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; }
  .price h3 { font-size: 18px; color: var(--ink-2); font-family: "DM Sans", system-ui, sans-serif; font-weight: 700; }
  .price .amt { font: 800 40px/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin: 8px 0 2px; }
  .price .per { font-size: 14px; color: var(--ink-2); }

  .grp { margin-top: 26px; background: var(--ink); color: #fff; border-radius: 24px; padding: 26px 28px; display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  .moncash { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 22px; color: var(--ink-2); font-size: 15px; }
