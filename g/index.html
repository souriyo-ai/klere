/* ---------- État ---------- */
const st = { lang: 'ht', g: null, logo: null, mode: 'kad', kImg: null, iImg: null, iURL: '', prof: null, gender: 'f', decor: 'studio', result: null, left: null, counted: false, pack: null };
const t = () => T[st.lang];
const q = new URLSearchParams(location.search);
const slug = (q.get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
const profTitle = () => { const p = PROFS.find((x) => x.k === st.prof); return p ? p[st.lang][st.gender === 'f' ? 1 : 0] : ''; };
const KEY = `souriyo_${slug}`;

function setLang(l) {
  st.lang = T[l] ? l : 'ht'; document.documentElement.lang = st.lang;
  try { localStorage.setItem('souriyo_lang', st.lang); } catch {}
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === st.lang));
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t()[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  $('kShare').textContent = $('iShare').textContent = t().share; $('kDl').textContent = $('iDl').textContent = t().dl; $('iAgain').textContent = t().again;
  document.querySelectorAll('#gender button').forEach((b) => { b.textContent = t().g[b.dataset.g]; b.setAttribute('aria-pressed', b.dataset.g === st.gender); });
  $('pq').placeholder = t().pq;
  if (st.g) {
    $('iaS').textContent = t().iaS(st.g.ia_gratis); $('telS').textContent = st.g.manm_selman ? t().telS.members : t().telS.open;
    $('iaTag').textContent = st.g.ia_gratis > 0 ? t().free : '100 G';
    renderOpts(); renderBuy(); drawKad();
    if (st.result) { $('resT').textContent = t().resT(profTitle()); $('left').textContent = t().left(st.left ?? 0); drawIa(); }
  }
}

/* ---------- Chaje gwoup la ---------- */
async function boot() {
  let l0 = q.get('lang'); try { l0 = l0 || localStorage.getItem('souriyo_lang'); } catch {}
  st.lang = l0 && T[l0] ? l0 : 'ht';
  let g = null;
  if (slug) { try { g = (await S.api(`groupes?slug=eq.${encodeURIComponent(slug)}&aktif=is.true&select=*`))[0]; } catch {} }
  if (!g) { setLang(st.lang); $('missing').classList.remove('hidden'); return; }
  st.g = g; if (!q.get('lang') && !l0) st.lang = g.lang;
  document.title = `${g.nom} · Souriyo`;
  document.documentElement.style.setProperty('--g1', g.c1); document.documentElement.style.setProperty('--g2', g.c2);
  $('gname').textContent = g.nom;
  S.api('rpc/kanpay_ote', { method: 'POST', body: JSON.stringify({ p_slug: slug }) }).then((r) => { const o = r && r[0]; if (!o) return; $('ote').innerHTML = `${o.verifye ? '<b>✓ Verifye</b>' : ''} ${{ ht: 'Kreye pa', fr: 'Créé par', en: 'Created by' }[st.lang] || 'Kreye pa'} ${String(o.non).replace(/[<>&]/g, '')}`; $('ote').classList.remove('hidden'); }).catch(() => {});
  if (g.logo_url) { $('glogo').src = g.logo_url; $('glogo').alt = g.nom; $('glogo').classList.remove('hidden'); }
  $('tabs').classList.toggle('hidden', !(g.mod_kad && g.mod_ia));
  st.mode = g.mod_kad ? 'kad' : 'ia';
  await K.fontsReady(); st.logo = await K.loadImage(g.logo_url);
  $('app').classList.remove('hidden');
  restore(); setMode(st.mode); setLang(st.lang);
  if (q.get('code')) { $('code').value = q.get('code').slice(0, 20).toUpperCase(); if (g.mod_ia) { setMode('ia'); $('buy').classList.remove('hidden'); } }
  if (q.get('tel')) $('iTel').value = q.get('tel');
  S.pemanAktif().then((a) => { st.auto = a; renderBuy(); });
  if (q.get('peye') && g.mod_ia) {
    setMode('ia'); const n = +q.get('peye');
    try { const r = await S.api('rpc/ia_rete', { method: 'POST', body: JSON.stringify({ p_slug: slug, p_tel: $('iTel').value }) }); if (r != null) st.left = r; } catch {}
    $('buy').classList.remove('hidden'); $('cMsg').textContent = t().paid(n); $('cMsg').classList.add('ok-msg');
    if (st.left > 0) { $('left').textContent = t().left(st.left); $('iAgain').classList.remove('hidden'); if (!st.result) $('ia1').classList.remove('hidden'); }
    history.replaceState(null, '', location.pathname + '?s=' + encodeURIComponent(slug) + '&tel=' + encodeURIComponent($('iTel').value));
    check(); keep();
  }
}
function setMode(m) {
  st.mode = m;
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
  $('mKad').classList.toggle('hidden', m !== 'kad'); $('mIa').classList.toggle('hidden', m !== 'ia');
  renderBuy();
}

/* ---------- Foto (redui a 1280 px) ---------- */
function readPhoto(file, max = 1280) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', .88); const out = new Image(); out.onload = () => res({ img: out, url }); out.src = url; URL.revokeObjectURL(img.src); };
    img.onerror = () => res(null); img.src = URL.createObjectURL(file);
  });
}

/* ---------- Kad gratis ---------- */
function drawKad() {
  if (!st.g || st.mode !== 'kad') return;
  K.draw($('cv'), st.g, st.kImg, { prenom: $('kName').value.trim().split(/\s+/)[0] || '', zoom: +$('kZ').value, dx: +$('kX').value, dy: +$('kY').value, logo: st.logo, logoPlate: true });
  $('kPrev').src = $('cv').toDataURL('image/jpeg', .9);
}
$('kFile').addEventListener('change', async () => { const f = $('kFile').files[0]; if (!f) return; const r = await readPhoto(f); if (!r) return; st.kImg = r.img; $('kAdj').classList.remove('hidden'); $('kShare').disabled = $('kDl').disabled = false; drawKad(); });
['kName', 'kZ', 'kX', 'kY'].forEach((id) => $(id).addEventListener('input', drawKad));

const blob = () => new Promise((r) => $('cv').toBlob(r, 'image/jpeg', 0.92));
async function count() { if (st.counted) return; st.counted = true; try { await S.api('rpc/konte_kad', { method: 'POST', body: JSON.stringify({ p_slug: slug }) }); } catch {} }
async function share(name) {
  const url = S.groupUrl(slug), text = t().shareText(st.g.nom, url);
  const file = new File([await blob()], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  download(name); window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); return true;
}
async function download(name) { const a = document.createElement('a'); a.href = URL.createObjectURL(await blob()); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
$('kShare').addEventListener('click', async () => { drawKad(); if (await share(`souriyo-${slug}.jpg`)) count(); });
$('kDl').addEventListener('click', () => { drawKad(); download(`souriyo-${slug}.jpg`); count(); });

/* ---------- Pòtrè IA ---------- */
function renderOpts() {
  const nq = (v) => String(v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const qq = nq($('pq').value.trim());
  const list = PROFS.filter((p) => !qq || [...p.fr, ...p.ht, ...p.en].some((x) => nq(x).includes(qq)));
  $('profs').innerHTML = list.map((p) => `<button type="button" class="opt" data-p="${p.k}" aria-pressed="${st.prof === p.k}"><span class="e">${p.e}</span>${p[st.lang][st.gender === 'f' ? 1 : 0]}</button>`).join('')
    + (list.length ? '' : `<p class="sub" style="grid-column:1/-1;margin:0">${t().noProf}</p>`) + `<button type="button" class="opt ask" id="askBtn"><span class="e">➕</span>${t().ask}</button>`;
  $('decors').innerHTML = DECORS.map((d) => `<button type="button" class="opt" data-d="${d.k}" aria-pressed="${st.decor === d.k}"><span class="e">${d.e}</span>${d[st.lang]}</button>`).join('');
  check();
}
function check() { $('iGo').disabled = !(st.prof && st.iImg && $('iOk').checked && $('iTel').value.replace(/\D/g, '').length >= 8); }
['iOk', 'iTel'].forEach((id) => $(id).addEventListener('input', check));
$('pq').addEventListener('input', renderOpts);
$('iFile').addEventListener('change', async () => { const f = $('iFile').files[0]; if (!f) return; const r = await readPhoto(f, 1024); if (!r) return $('iErr').textContent = t().errPhoto; st.iImg = r.img; st.iURL = r.url; $('iErr').textContent = ''; check(); });
document.addEventListener('click', (e) => {
  const l = e.target.closest('[data-lang]'); if (l) return setLang(l.dataset.lang);
  const m = e.target.closest('[data-mode]'); if (m) return setMode(m.dataset.mode);
  const p = e.target.closest('[data-p]'); if (p) { st.prof = p.dataset.p; return renderOpts(); }
  const d = e.target.closest('[data-d]'); if (d) { st.decor = d.dataset.d; return renderOpts(); }
  const g = e.target.closest('[data-g]'); if (g) { st.gender = g.dataset.g; return setLang(st.lang); }
  const k = e.target.closest('[data-pack]'); if (k) { st.pack = +k.dataset.pack; return renderBuy(); }
  if (e.target.closest('#askBtn')) { $('reqBox').classList.remove('hidden'); if (!$('reqM').value) $('reqM').value = $('pq').value.trim(); $('reqM').focus(); }
});
$('reqGo').addEventListener('click', async () => {
  const m = $('reqM').value.trim().slice(0, 60); if (m.length < 2) return ($('reqMsg').textContent = t().reqNeed);
  try { await S.api('demandes', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ groupe_slug: slug, metye: m, telefon: $('reqTel').value.trim() || null, lang: st.lang }) }); $('reqMsg').textContent = t().reqOk(m); $('reqM').value = ''; }
  catch { $('reqMsg').textContent = t().errs.api; }
});

let MT = null;
$('iGo').addEventListener('click', async () => {
  $('iErr').textContent = '';
  $('ia1').classList.add('hidden'); $('iaGen').classList.remove('hidden');
  let i = 0; $('genMsg').textContent = t().msgs[0]; MT = setInterval(() => { i = Math.min(i + 1, 3); $('genMsg').textContent = t().msgs[i]; }, 2200);
  try {
    const r = await fetch(S.IA_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug, image: st.iURL.split(',')[1], profession: st.prof, decor: st.decor, telephone: $('iTel').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'api');
    const img = await K.loadImage(`data:${j.mime || 'image/png'};base64,${j.image}`);
    st.result = img; st.left = j.left ?? 0;
    $('iaRes').classList.remove('hidden'); $('resT').textContent = t().resT(profTitle()); $('left').textContent = t().left(st.left);
    $('iAgain').classList.toggle('hidden', st.left <= 0); drawIa(); keep();
  } catch (e) {
    $('ia1').classList.remove('hidden'); $('iErr').textContent = t().errs[e.message] || t().errs.api;
    if (['quota', 'closed'].includes(e.message)) { st.left = 0; $('buy').classList.remove('hidden'); renderBuy(); }
  } finally { clearInterval(MT); $('iaGen').classList.add('hidden'); renderBuy(); }
});
function drawIa() { K.draw($('cv'), st.g, st.result, { modele: 'pwo', prenom: $('iName').value.trim().split(/\s+/)[0] || '', titre: profTitle(), logo: st.logo, logoPlate: true }); $('iPrev').src = $('cv').toDataURL('image/jpeg', .9); }
$('iShare').addEventListener('click', () => { drawIa(); share(`souriyo-${slug}-${st.prof}.jpg`); });
$('iDl').addEventListener('click', () => { drawIa(); download(`souriyo-${slug}-${st.prof}.jpg`); });
$('iAgain').addEventListener('click', () => { $('iaRes').classList.add('hidden'); $('ia1').classList.remove('hidden'); st.prof = null; renderOpts(); });

/* ---------- Pòtrè a kenbe sou telefòn nan ---------- */
function keep() { try { const c = document.createElement('canvas'), im = st.result, k = Math.min(1, 900 / im.width); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); localStorage.setItem(KEY, JSON.stringify({ img: c.toDataURL('image/jpeg', .85), prof: st.prof, gender: st.gender, name: $('iName').value, tel: $('iTel').value, left: st.left })); } catch {} }
async function restore() {
  let k = null; try { k = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
  if (!k || !k.img || !st.g.mod_ia) return;
  st.result = await K.loadImage(k.img); if (!st.result) return;
  Object.assign(st, { prof: k.prof, gender: k.gender || 'f', left: k.left ?? 0 }); $('iName').value = k.name || ''; $('iTel').value = k.tel || '';
  st.mode = 'ia'; $('ia1').classList.add('hidden'); $('iaRes').classList.remove('hidden'); $('iAgain').classList.toggle('hidden', st.left <= 0);
}

/* ---------- Achte plis ---------- */
function renderBuy() {
  if (!st.g) return;
  const show = st.g.mod_ia && st.mode === 'ia' && (st.left === 0 || !$('buy').classList.contains('hidden'));
  $('buy').classList.toggle('hidden', !show);
  const baz = ['piblik', 'melanj'].includes(st.g.mod_pey) ? +st.g.pri_piblik_htg || 100 : 100;
  const PK = S.PACKS.map((k) => ({ ...k, p: k.n === 1 ? baz : Math.round(baz * (k.n === 3 ? 2.5 : 3.5)) }));
  $('packs').innerHTML = PK.map((k) => `<button type="button" class="pack" data-pack="${k.n}" aria-pressed="${st.pack === k.n}">${k.tag ? `<em>${k.tag === 'save' ? t().tagSave(k.n * baz - k.p) : t().tagBest}</em>` : ''}<b>${k.n}</b><span>${t().pk(k.n)}</span><strong>${k.p} G</strong></button>`).join('');
  const k = PK.find((x) => x.n === st.pack); $('howto').classList.toggle('hidden', !k);
  $('payMc').classList.toggle('hidden', !st.auto); $('payOr').classList.toggle('hidden', !st.auto);
  if (k && st.auto) { $('payMc').textContent = t().payBtn(k.p); $('payOr').textContent = t().payOr; }
  if (k) { $('howList').innerHTML = t().steps(k.p).map((x) => `<li>${x}</li>`).join(''); $('buyWa').textContent = t().waBtn; $('buyWa').href = `https://wa.me/${S.WA}?text=${encodeURIComponent(t().waMsg(k.n, k.p, $('iTel').value.trim(), st.g.nom))}`; }
}
$('payMc').addEventListener('click', async () => {
  const tel = $('iTel').value.trim(); if (tel.replace(/\D/g, '').length < 8) { $('iTel').focus(); $('cMsg').textContent = t().errTel; return; }
  $('payMc').disabled = true; $('cMsg').textContent = '';
  const u = new URL(location.href); u.searchParams.set('tel', tel.replace(/\D/g, '').slice(-8));
  const e = await S.peye({ tip: 'potre', slug, tel, n: st.pack }, null, u.toString());
  $('payMc').disabled = false; if (e) $('cMsg').textContent = t().errs[e] || t().payErr;
});
$('redeem').addEventListener('click', async () => {
  const code = $('code').value.trim(), tel = $('iTel').value.trim();
  const msg = (x, ok) => { $('cMsg').textContent = x; $('cMsg').classList.toggle('ok-msg', !!ok); };
  if (!code) return msg(t().cErr.empty); if (tel.replace(/\D/g, '').length < 8) { $('iTel').focus(); return msg(t().errTel); }
  $('redeem').disabled = true;
  let j; try { j = await S.api('rpc/utiliser_coupon', { method: 'POST', body: JSON.stringify({ p_code: code, p_tel: tel, p_slug: slug }) }); } catch { j = { ok: false, error: 'api' }; }
  $('redeem').disabled = false;
  if (!j.ok) return msg(t().cErr[j.error] || t().errs[j.error] || t().errs.api);
  st.left = j.left; $('code').value = ''; msg(t().cOk(j.photos), true);
  $('left').textContent = t().left(st.left); $('iAgain').classList.remove('hidden'); $('iErr').textContent = '';
  if (!st.result) { $('ia1').classList.remove('hidden'); } check(); keep();
});

boot();
</script>
