<!doctype html>
<html lang="ht"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Souriyo</title>
<script>
// souriyo.com/upnch  →  souriyo.com/g/?s=upnch  (GitHub Pages pa konnen adrès gwoup yo)
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg.shift() + '/' : '/';
  var slug = (seg[0] || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  var qs = location.search ? '&' + location.search.slice(1) : '';
  location.replace(slug ? base + 'g/?s=' + slug + qs : base);
})();
</script></head><body style="font-family:system-ui;text-align:center;padding:40px">Souriyo…</body></html>
